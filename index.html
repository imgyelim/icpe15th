<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제자훈련 15차</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f5f0;color:#3f3a34;font-family:"Noto Sans KR","Malgun Gothic",sans-serif}
header{background:#5f574d;color:#fff;padding:28px 20px;text-align:center}
header h1{margin:0 0 7px;font-size:26px;letter-spacing:-1px}
header p{margin:0;color:#ddd6cd;font-size:13px}
.container{max-width:1050px;margin:0 auto;padding:22px 16px 50px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tab{border:1px solid #d8d0c5;background:#fff;border-radius:20px;padding:10px 15px;cursor:pointer;color:#625b53}
.tab.active{background:#6b6258;color:#fff;border-color:#6b6258}
.card{background:#fff;border:1px solid #e5ded5;border-radius:15px;padding:20px;margin-bottom:16px;box-shadow:0 3px 12px rgba(70,60,50,.04)}
h2{font-size:19px;margin:0 0 16px}
h3{font-size:15px;margin:20px 0 10px;color:#655d54}
.prayer{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid #eee8e1}
.prayer:last-child{border-bottom:0}
.check{width:20px;height:20px;margin-top:1px;accent-color:#6b6258}
.label{font-weight:600;font-size:14px}
.note{font-size:12px;color:#948b80;margin-top:4px}
.progress{height:7px;background:#eee9e2;border-radius:5px;overflow:hidden;margin-top:15px}
.progress span{display:block;height:100%;background:#81766a;width:0%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
input,textarea,select{width:100%;border:1px solid #dcd4ca;border-radius:9px;padding:10px;font:inherit;background:#fff}
textarea{min-height:100px;resize:vertical}
button{border:0;border-radius:9px;background:#6b6258;color:#fff;padding:10px 15px;cursor:pointer}
button.secondary{background:#eee9e2;color:#5d554c}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.archive-item{border:1px solid #e5ded5;border-radius:11px;padding:14px;margin-top:10px;background:#fcfbf9}
.lock-box{background:#f7f4ef;border-radius:11px;padding:16px;margin-top:10px}
.lock-title{font-weight:700;margin-bottom:6px}
.lock-note{font-size:12px;color:#8d847a;line-height:1.5;margin-bottom:10px}
.password-row{display:flex;gap:8px}
.password-row input{flex:1}
.locked-content{display:none}
.unlock-badge{font-size:11px;color:#6d6257;margin-top:8px}
.archive-item strong{display:block;margin-bottom:5px}
.archive-item small{color:#91887e}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.calendar-title{font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid #e5ded5;border-left:1px solid #e5ded5}
.day-name,.day{min-height:80px;border-right:1px solid #e5ded5;border-bottom:1px solid #e5ded5;padding:7px}
.day-name{text-align:center;min-height:auto;background:#f7f4ef;font-size:12px;color:#80776d}
.day.muted{color:#c2bbb2;background:#fbfaf8}
.day.today{background:#f0ece5}
.day-num{font-size:12px;font-weight:700}
.event{margin-top:5px;background:#756b60;color:white;border-radius:5px;padding:3px 5px;font-size:10px;line-height:1.3}
.event.prayer-event{background:#9b866c}
.calendar-add{margin-top:14px}
.dashboard{text-align:center;padding:28px 24px 24px;position:relative;overflow:hidden}
.dashboard:before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;background:#f4eee5;right:-75px;top:-90px;opacity:.7}
.dashboard h2{position:relative}
.savings-wrap{position:relative;display:flex;justify-content:center;align-items:center;margin:12px auto 6px;width:180px;height:145px}
.coin{position:absolute;width:112px;height:18px;border-radius:50%;background:#d5a85c;box-shadow:0 3px 0 #b88942;top:9px;z-index:3}
.coin:after{content:"";position:absolute;left:25px;right:25px;top:6px;height:3px;border-radius:4px;background:#b88942}
.jar{position:relative;width:118px;height:112px;border:5px solid #8f806e;border-top:0;border-radius:10px 10px 26px 26px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 8px 16px rgba(80,65,50,.08);overflow:hidden}
.jar:before{content:"";position:absolute;left:11px;top:-8px;width:86px;height:18px;border:5px solid #8f806e;border-radius:9px;background:#e9e1d5}
.coins{position:absolute;left:9px;right:9px;bottom:9px;height:76px;display:flex;align-items:flex-end;justify-content:center;gap:2px;flex-wrap:wrap-reverse;overflow:hidden}
.mini-coin{width:25px;height:8px;border-radius:50%;background:#d5a85c;box-shadow:0 2px 0 #b88942}
.dashboard-number{font-size:42px;font-weight:800;line-height:1;margin-top:4px;color:#5f574d;position:relative}
.dashboard-sub{font-size:13px;color:#8d847a;margin-top:7px}
.dashboard-meta{font-size:12px;color:#8d847a;margin-top:8px}
.current-challenge{position:relative;margin:20px auto 4px;padding:14px 18px;max-width:430px;background:#f3ede4;border:1px solid #e2d8cb;border-radius:13px;text-align:center}
.current-challenge-label{font-size:11px;color:#918579;letter-spacing:.3px}
.current-challenge-title{font-size:18px;font-weight:800;color:#5f574d;margin-top:3px}
.current-challenge-sub{font-size:12px;color:#8d847a;margin-top:3px}
.current-challenge-day{font-size:15px;font-weight:800;color:#7b6b59;margin-top:7px}
.current-challenge-end{font-size:11px;color:#93897e;margin-top:4px}
.prayer-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px;text-align:left}
.prayer-stat{background:#f7f4ef;border-radius:10px;padding:11px}
.prayer-stat strong{display:block;font-size:12px;line-height:1.4}
.prayer-stat span{display:block;margin-top:6px;font-size:12px;color:#746b61}
@media(max-width:700px){.prayer-summary{grid-template-columns:1fr 1fr}}
.hidden{display:none}
@media(max-width:700px){.grid{grid-template-columns:1fr}.day{min-height:65px;padding:5px}.event{font-size:9px}.tab{font-size:12px;padding:8px 11px}}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://zijzthkxomyscbbgrjoi.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_pO6Da-DFOpVbA3ZdkcZtkQ_PjjYl4st";
const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const PRAYER_IDS = ["circle1","circle2","circle3","circle4"];

async function recordSharedPrayer(prayerId, memberName) {
  const { error } = await supabaseClient
    .from("prayer_records")
    .insert({ prayer_id: prayerId, member: memberName || null });
  if (error) {
    console.error("공용 기도 기록 저장 실패:", error);
    throw error;
  }
}

async function getSharedPrayerCounts() {
  const counts = Object.fromEntries(PRAYER_IDS.map(id => [id, 0]));
  const { data, error } = await supabaseClient
    .from("prayer_records")
    .select("prayer_id");
  if (error) {
    console.error("공용 기도 기록 불러오기 실패:", error);
    return counts;
  }
  (data || []).forEach(row => {
    if (counts[row.prayer_id] !== undefined) counts[row.prayer_id]++;
  });
  return counts;
}

async function refreshSharedPrayerCounts() {
  const counts = await getSharedPrayerCounts();
  Object.entries(counts).forEach(([id, count]) => {
    const el = document.querySelector("#" + id + "Count");
    if (el) el.textContent = count;
  });
  const total = Object.values(counts).reduce((a,b) => a+b, 0);
  document.querySelectorAll("[data-shared-prayer-total]").forEach(el => {
    el.textContent = total;
  });
}

document.addEventListener("DOMContentLoaded", () => {
  refreshSharedPrayerCounts();
  // 다른 사람이 체크한 내용이 보이도록 15초마다 최신 집계 확인
  setInterval(refreshSharedPrayerCounts, 15000);
});
</script>

</head>
<body>
<header>
<h1>제자훈련 15차</h1>
<p>함께 기도하고, 함께 기록하는 우리의 여정</p>
</header>

<div class="container">
  <section class="card dashboard">
    <h2>공통 기도 누적 집계</h2>
    <p class="note">기도 한 번, 한 번을 함께 저축합니다.</p>
    <div class="savings-wrap">
      <div class="coin"></div>
      <div class="jar"><div class="coins" id="coinStack"></div></div>
    </div>
    <div class="dashboard-number" id="totalToday">0회</div>
    <div class="dashboard-sub">지금까지 함께 바친 공통 기도 체크 수</div>
    <div class="progress"><span id="totalProgress"></span></div>
    <div class="dashboard-meta" id="totalMeta"></div>
    <div class="current-challenge">
      <div class="current-challenge-label">현재 진행 중인 기도</div>
      <div class="current-challenge-title">33일 봉헌기도</div>
      <div class="current-challenge-sub">함께 한 마음으로 봉헌하는 기도</div>
      <div class="current-challenge-day" id="currentPrayerDay">D+16</div>
      <div class="current-challenge-end" id="currentPrayerEnd"></div>
    </div>
    <div class="prayer-summary" id="prayerSummary"></div>
  </section>

  <div class="tabs" id="memberTabs"></div>

  <section id="memberPage">
    <div class="card">
      <h2 id="memberName"></h2>
      <h3>공통 기도함</h3>
      <div id="prayers"></div>
      <div class="progress"><span id="progressBar"></span></div>
      <div id="progressText" class="note"></div>
    </div>

    <div class="card">
      <h2>개인 기도 기록 🔒</h2>
      <div id="personalLockArea"></div>
      <div id="personalContent" class="locked-content">
        <div class="grid">
          <div>
            <label class="note">날짜</label>
            <input type="date" id="personalDate">
          </div>
          <div>
            <label class="note">기도 제목</label>
            <input id="personalTitle" placeholder="기도 제목을 적어주세요">
          </div>
        </div>
        <div style="margin-top:10px">
          <textarea id="personalMemo" placeholder="기도 내용이나 나눔을 기록해보세요."></textarea>
        </div>
        <button style="margin-top:10px" onclick="addPersonal()">기록하기</button>
        <div id="personalList"></div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>기도 챌린지 아카이빙</h2>
    <p class="note">함께 했던 기도 챌린지를 페이지별로 남겨두고, 나중에 다시 볼 수 있습니다.</p>
    <div class="grid">
      <input id="challengeTitle" placeholder="예: 54일 기도 챌린지">
      <div class="grid" style="gap:8px">
        <input type="date" id="challengeStart" title="시작 기간">
        <input type="date" id="challengeEnd" title="끝 기간">
      </div>
    </div>
    <textarea id="challengeMemo" style="margin-top:10px" placeholder="챌린지 내용, 기간, 묵상, 사진 설명 등을 기록하세요."></textarea>
    <button style="margin-top:10px" onclick="addChallenge()">아카이빙하기</button>
    <div id="challengeList"></div>
  </section>

  <section class="card">
    <div class="calendar-head">
      <button class="secondary" onclick="changeMonth(-1)">‹</button>
      <div class="calendar-title" id="calTitle"></div>
      <button class="secondary" onclick="changeMonth(1)">›</button>
    </div>
    <div class="cal" id="calendar"></div>
    <div class="calendar-add">
      <h3>공용 캘린더 일정 추가</h3>
      <div class="row">
        <input type="date" id="eventDate">
        <input id="eventTitle" placeholder="예: SONE 피정">
        <button onclick="addEvent()">추가</button>
      </div>
    </div>
  </section>
</div>

<script>
const members=[
"진예 나예 릿다",
"김지현 세실리아",
"김태희 세실리아",
"이장미 아녜스",
"정태겸 요셉",
"최정애 미카엘라"
];
// 첫 이름은 요청 문구의 "고나예 릿다"를 그대로 사용
members[0]="고나예 릿다";

const prayerTitles=[
"제자훈련 15차의 평안을 위해",
"제자훈련 15차의 SONE 피정을 위해",
"ICPE를 위해",
"최정애 미카엘라 자매의 합격을 위해"
];

let current=localStorage.getItem("dj15_member")||members[0];
let calDate=new Date();
let data=JSON.parse(localStorage.getItem("dj15_data")||'{"checks":{},"personal":{},"challenges":[],"events":[]}');
data.checks=data.checks||{}; data.personal=data.personal||{}; data.challenges=data.challenges||[]; data.events=data.events||[];

function save(){localStorage.setItem("dj15_data",JSON.stringify(data));}
function renderTabs(){
 const el=document.getElementById("memberTabs"); el.innerHTML="";
 members.forEach(m=>{
  const b=document.createElement("button"); b.className="tab"+(m===current?" active":""); b.textContent=m;
  b.onclick=()=>{current=m;localStorage.setItem("dj15_member",m);renderAll()}; el.appendChild(b);
 });
}
const currentPrayer={name:"33일 봉헌기도",day:16,total:33};
function datePlusDays(date,days){
 const d=new Date(date+"T00:00:00");
 d.setDate(d.getDate()+days);
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function formatKoreanDate(iso){
 const [y,m,d]=iso.split("-");
 return `${y}년 ${Number(m)}월 ${Number(d)}일`;
}
function currentPrayerEndDate(){
 // 16일차가 오늘이면 33일차까지 17일 후
 return datePlusDays(todayISO(),currentPrayer.total-currentPrayer.day);
}
function renderCurrentPrayer(){
 const end=currentPrayerEndDate();
 document.getElementById("currentPrayerDay").textContent=`D+${currentPrayer.day} / ${currentPrayer.total}`;
 document.getElementById("currentPrayerEnd").textContent=`예상 봉헌 완료일 · ${formatKoreanDate(end)}`;
}
function todayISO(){
 const d=new Date();
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function renderDashboard(){
 let total=0;
 const perPrayer=[0,0,0,0];
 let possible=0;
 members.forEach(m=>{
  const days=data.checks[m]||{};
  Object.keys(days).forEach(date=>{
   const arr=days[date]||[];
   arr.forEach((v,i)=>{if(v){total++;perPrayer[i]++}});
   possible+=4;
  });
 });
 // 가능한 횟수는 실제로 기도 기록이 시작된 날짜 수를 기준으로 계산
 const allDates=new Set();
 members.forEach(m=>Object.keys(data.checks[m]||{}).forEach(d=>allDates.add(d)));
 possible=allDates.size*members.length*4;
 document.getElementById("totalToday").textContent=`${total}회`;
 const coins=document.getElementById("coinStack");
 if(coins){
   coins.innerHTML="";
   const n=Math.min(total,36);
   for(let i=0;i<n;i++){const c=document.createElement("span");c.className="mini-coin";coins.appendChild(c);}
 }
 document.getElementById("totalProgress").style.width=(possible?Math.min(total/possible*100,100):0)+"%";
 document.getElementById("totalMeta").textContent=`총 ${allDates.size}일 · 6명 · 4개 공통 기도제목 기준`;
 const wrap=document.getElementById("prayerSummary");wrap.innerHTML="";
 prayerTitles.forEach((p,i)=>{
  const d=document.createElement("div");d.className="prayer-stat";
  d.innerHTML=`<strong>원의 ${i+1}</strong><span>누적 ${perPrayer[i]}회</span>`;
  wrap.appendChild(d);
 });
}

function renderPrayers(){
 document.getElementById("memberName").textContent=current;
 const wrap=document.getElementById("prayers");
 const key=current, today=todayISO();
 data.checks[key]=data.checks[key]||{};
 data.checks[key][today]=data.checks[key][today]||[false,false,false,false];
 const todayChecks=data.checks[key][today];
 wrap.innerHTML="";
 prayerTitles.forEach((p,i)=>{
  const row=document.createElement("label");row.className="prayer";
  row.innerHTML=`<input class="check" type="checkbox" ${todayChecks[i]?"checked":""}>
   <div><div class="label">원의 ${i+1}: ${p}</div><div class="note">오늘 공통 기도 체크</div></div>`;
  row.querySelector("input").onchange=async e=>{
   todayChecks[i]=e.target.checked;
   save();renderPrayers();renderDashboard();
   if(e.target.checked){
     try{
       await recordSharedPrayer("circle"+(i+1), current);
       await refreshSharedPrayerCounts();
     }catch(err){
       alert("공용 기도 기록 저장에 실패했습니다. 인터넷 연결과 Supabase 설정을 확인해주세요.");
     }
   }
  };
  wrap.appendChild(row);
 });
 const done=todayChecks.filter(Boolean).length;
 document.getElementById("progressBar").style.width=(done/4*100)+"%";
 document.getElementById("progressText").textContent=`오늘의 공통 기도 ${done}/4 완료`;
}

async function hashPassword(password){
 const data=new TextEncoder().encode(password);
 const hash=await crypto.subtle.digest("SHA-256",data);
 return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function personalPasswordKey(){return "dj15_pw_"+current}
function isUnlocked(){return sessionStorage.getItem(personalPasswordKey())==="unlocked"}
function renderPersonalLock(){
 const area=document.getElementById("personalLockArea");
 const content=document.getElementById("personalContent");
 if(isUnlocked()){
  area.innerHTML=`<div class="unlock-badge">🔓 ${current}님의 개인 기도 기록이 열려 있습니다. 이 브라우저 탭을 닫으면 다시 잠깁니다.</div>`;
  content.style.display="block"; renderPersonal(); return;
 }
 content.style.display="none";
 const hasPassword=!!localStorage.getItem(personalPasswordKey());
 if(!hasPassword){
  area.innerHTML=`<div class="lock-box">
   <div class="lock-title">개인 암호 설정</div>
   <div class="lock-note">처음 한 번 암호를 설정하면 이 이름의 개인 기도 기록은 암호를 입력해야 볼 수 있습니다.</div>
   <div class="password-row"><input type="password" id="newPersonalPw" placeholder="암호 입력"><button onclick="setPersonalPassword()">암호 설정</button></div>
  </div>`;
 }else{
  area.innerHTML=`<div class="lock-box">
   <div class="lock-title">개인 기도 기록 잠금</div>
   <div class="lock-note">이 기록은 ${current}님의 개인 기록입니다. 암호를 입력하면 볼 수 있습니다.</div>
   <div class="password-row"><input type="password" id="personalPw" placeholder="암호 입력" onkeydown="if(event.key==='Enter')unlockPersonal()"><button onclick="unlockPersonal()">열기</button></div>
  </div>`;
 }
}
async function setPersonalPassword(){
 const pw=document.getElementById("newPersonalPw").value;
 if(!pw||pw.length<4)return alert("암호는 4자 이상으로 설정해주세요.");
 localStorage.setItem(personalPasswordKey(),await hashPassword(pw));
 sessionStorage.setItem(personalPasswordKey(),"unlocked");
 renderPersonalLock();
}
async function unlockPersonal(){
 const pw=document.getElementById("personalPw").value;
 const stored=localStorage.getItem(personalPasswordKey());
 if(stored && await hashPassword(pw)===stored){
  sessionStorage.setItem(personalPasswordKey(),"unlocked"); renderPersonalLock();
 }else alert("암호가 맞지 않습니다.");
}
function addPersonal(){
 if(!isUnlocked())return;
 const title=document.getElementById("personalTitle").value.trim();
 if(!title)return alert("기도 제목을 입력해주세요.");
 const item={date:document.getElementById("personalDate").value||new Date().toISOString().slice(0,10),title,memo:document.getElementById("personalMemo").value};
 data.personal[current]=data.personal[current]||[];data.personal[current].unshift(item);save();
 document.getElementById("personalTitle").value="";document.getElementById("personalMemo").value="";renderPersonal();
}
function renderPersonal(){
 if(!isUnlocked())return;
 const list=document.getElementById("personalList");list.innerHTML="";
 (data.personal[current]||[]).forEach(x=>{
  const d=document.createElement("div");d.className="archive-item";
  d.innerHTML=`<strong>${esc(x.title)}</strong><small>${x.date}</small><div style="margin-top:7px">${esc(x.memo||"")}</div>`;
  list.appendChild(d);
 });
}
function addChallenge(){
 const title=document.getElementById("challengeTitle").value.trim();
 const start=document.getElementById("challengeStart").value;
 const end=document.getElementById("challengeEnd").value;
 if(!title)return alert("챌린지 이름을 입력해주세요.");
 if(!start||!end)return alert("시작 기간과 끝 기간을 모두 입력해주세요.");
 if(end<start)return alert("끝 기간은 시작 기간보다 빠를 수 없습니다.");
 data.challenges.unshift({title,start,end,memo:document.getElementById("challengeMemo").value});
 save();document.getElementById("challengeTitle").value="";document.getElementById("challengeStart").value="";document.getElementById("challengeEnd").value="";document.getElementById("challengeMemo").value="";renderChallenges();
}
function renderChallenges(){
 const list=document.getElementById("challengeList");list.innerHTML="";
 data.challenges.forEach((x,i)=>{
  const start=x.start||x.date||"";
  const end=x.end||x.date||"";
  const d=document.createElement("div");d.className="archive-item";
  d.innerHTML=`<strong>${esc(x.title)}</strong><small>${start} ~ ${end}</small><div style="margin-top:7px">${esc(x.memo||"")}</div>
  <button class="secondary" style="margin-top:8px" onclick="deleteChallenge(${i})">삭제</button>`;
  list.appendChild(d);
 });
}
function deleteChallenge(i){if(confirm("이 기록을 삭제할까요?")){data.challenges.splice(i,1);save();renderChallenges()}}

function addEvent(){
 const title=document.getElementById("eventTitle").value.trim(),date=document.getElementById("eventDate").value;
 if(!title||!date)return alert("날짜와 일정명을 입력해주세요.");
 data.events.push({date,title});save();document.getElementById("eventTitle").value="";renderCalendar();
}
function changeMonth(n){calDate.setMonth(calDate.getMonth()+n);renderCalendar()}
function renderCalendar(){
 const y=calDate.getFullYear(),m=calDate.getMonth();
 document.getElementById("calTitle").textContent=`${y}년 ${m+1}월`;
 const el=document.getElementById("calendar");el.innerHTML="";
 ["일","월","화","수","목","금","토"].forEach(x=>{let d=document.createElement("div");d.className="day-name";d.textContent=x;el.appendChild(d)});
 const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();
 for(let i=0;i<42;i++){
  const d=document.createElement("div");d.className="day";
  let num=i-first+1, yy=y,mm=m;
  if(num<1){num=prev+num;mm=m-1;if(mm<0){mm=11;yy--}d.classList.add("muted")}
  else if(num>last){num=num-last;mm=m+1;if(mm>11){mm=0;yy++}d.classList.add("muted")}
  const iso=`${yy}-${String(mm+1).padStart(2,"0")}-${String(num).padStart(2,"0")}`;
  d.innerHTML=`<div class="day-num">${num}</div>`;
  data.events.filter(e=>e.date===iso).forEach(e=>{
   const ev=document.createElement("div");ev.className="event";ev.textContent=e.title;d.appendChild(ev)
  });
  const prayerEnd=currentPrayerEndDate();
  if(iso===prayerEnd){
   const ev=document.createElement("div");ev.className="event prayer-event";ev.textContent="🙏 33일 봉헌기도 완료";d.appendChild(ev);
  }
  const today=new Date().toISOString().slice(0,10);if(iso===today)d.classList.add("today");
  el.appendChild(d);
 }
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function renderAll(){renderCurrentPrayer();renderDashboard();renderTabs();renderPrayers();renderPersonalLock();renderChallenges();renderCalendar()}
renderAll();
</script>
